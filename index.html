<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <title>c3-schema-gen</title>

    <link rel="icon" href="assets/c3-json.svg" image="image/svg+xml">

    <link rel="stylesheet" href="css/theme.css">
    <link rel='stylesheet' href='css/index.css'>
    <link rel="stylesheet" href="css/utils.css">
</head>
<body>

    <header class="vflex align-items-center">
        <img src="assets/title.svg" alt="c3-schema-gen" style="height: 3.5rem;">

        <p>Create a JSON schema for the config file of the C3 language specific to your environment</p>

        <div class="hflex flex-center gap1">
            <a href="https://c3-lang.org"> <img src="assets/c3-link.svg" alt="C3"> </a>
            <a href="https://github.com/HabibulAlamAsif1/c3-schema-gen"> <img src="assets/github-link.svg" alt="githbu"> </a>
        </div>
    </header>

    <div style="height: 3rem;"></div>    

    <main>
        <button id="generate">Generate</button>

        <div class="text-fields">
            <div class="vflex gap1 fill">
                <div class="textbox-container">
                    <div class="textbox-toolbar" style="grid-template-columns: auto 1fr auto;">
                        <button class="icon clear-btn"> <img class="icon-img" src="assets/clear.svg" title="Clear Text"> </button>
                        Properties
                        <button class="icon paste-btn"> <img class="icon-img" src="assets/paste.svg" title="Paste"> </button>
                    </div>

                    <textarea spellcheck="false" wrap="off" id="input-box-props" placeholder="paste output from: c3c --list-project-properties"></textarea>
                </div>

                <div class="textbox-container">
                    <div class="textbox-toolbar" style="grid-template-columns: auto 1fr auto;">
                        <button class="icon clear-btn"> <img class="icon-img" src="assets/clear.svg" title="Clear Text"> </button>
                        Targets
                        <button class="icon paste-btn"> <img class="icon-img" src="assets/paste.svg" title="Paste"> </button>
                    </div>

                    <textarea spellcheck="false" wrap="off" id="input-box-targets" placeholder="paste output from: c3c --list-targets"></textarea>
                </div>
            </div>

            <div class="textbox-container">
                <div class="textbox-toolbar" style="grid-template-columns: auto 1fr auto auto;">
                    <button class="icon clear-btn"> <img class="icon-img" src="assets/clear.svg" title="Clear Text"> </button>
                    Output
                    <button class="icon" id="copy-btn"> <img class="icon-img" src="assets/copy.svg" title="Copy"> </button>
                    <button class="icon inactive" id="download-btn" title="Download as File">
                        <!-- Created with Inkscape (http://www.inkscape.org/) -->
                        <svg
                        width="32"
                        height="32"
                        viewBox="0 0 32 32"
                        version="1.1"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            style="fill:none;stroke-width:3;stroke-linecap:round;"
                            d="M 2.4253209,19.366936 V 30.133061 H 29.574677 V 19.366936"/>
                        <path
                            d="m 14.350511,3.616801 h 3.448791 l 0.22992,12.651434 H 25.6 L 16,24.702528 6.3999999,16.268235 h 8.0271531 z"/>
                        </svg>
                    </button>
                </div>

                <textarea spellcheck="false" wrap="off" id="output-box" placeholder="schema will appear here"></textarea>
            </div>
        </div>

        <div style="height: 4rem;"></div>
    </main>

    <script>
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.style.colorScheme = "dark"
            document.documentElement.dataset.theme = "dark"
        }
    </script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
