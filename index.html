<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <title>c3-schema-gen</title>

    <link rel="icon" href="assets/c3-json.svg" image="image/svg+xml">

    <link rel="stylesheet" href="css/theme.css">
    <link rel='stylesheet' href='css/index.css'>
    <link rel="stylesheet" href="css/utils.css">
</head>
<body>

    <header class="vflex align-items-center">
        <img src="assets/title.svg" alt="c3-schema-gen" style="height: 3.5rem;">

        <p>Create a JSON schema for the config file of the C3 language specific to your environment</p>

        <div class="hflex flex-center gap1">
            <a href="https://c3-lang.org"> <img src="assets/c3-link.svg" alt="C3"> </a>
            <a href="https://github.com/HabibulAlamAsif1/c3-schema-gen"> <img src="assets/github-link.svg" alt="githbu"> </a>
        </div>
    </header>

    <div style="height: 3rem;"></div>    

    <main>
        <div class="text-fields">
            <div class="vflex gap1 fill">
                <div class="textbox-container">
                    <div class="textbox-toolbar" style="grid-template-columns: auto 1fr auto;">
                        <button class="icon"> <img class="icon-img" src="assets/clear.svg" title="Clear Text"> </button>
                        Properties
                        <button class="icon"> <img class="icon-img" src="assets/paste.svg" title="Paste"> </button>
                    </div>

                    <textarea spellcheck="false" wrap="off" id="input-box-props"></textarea>
                </div>

                <div class="textbox-container">
                    <div class="textbox-toolbar" style="grid-template-columns: auto 1fr auto;">
                        <button class="icon"> <img class="icon-img" src="assets/clear.svg" title="Clear Text"> </button>
                        Targets
                        <button class="icon"> <img class="icon-img" src="assets/paste.svg" title="Paste"> </button>
                    </div>

                    <textarea spellcheck="false" wrap="off" id="input-box-targets"></textarea>
                </div>
            </div>

            <div class="textbox-container">
                <div class="textbox-toolbar" style="grid-template-columns: auto 1fr auto auto;">
                    <button class="icon"> <img class="icon-img" src="assets/clear.svg" title="Clear Text"> </button>
                    Output
                    <button class="icon"> <img class="icon-img" src="assets/copy.svg" title="Copy"> </button>
                    <button class="icon"> <img class="icon-img" src="assets/download.svg" title="Download as File"> </button>
                </div>

                <textarea spellcheck="false" wrap="off" id="output-box"></textarea>
            </div>
        </div>

        <div style="height: 4rem;"></div>
    </main>

    <script src="js/index.js"></script>
</body>
</html>
